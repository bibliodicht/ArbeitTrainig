<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>初日クエスト(見本)</title>
<style>
:root{
  --bg:#f6f3ec;--surface:#fffdf8;--text:#14161c;--muted:#5a5750;
  --line:#ddd7c8;--edge:#8a8574;
  --accent:#c9a45c;--accent-ink:#14161c;--accent-text:#755716;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Hiragino Sans","Yu Gothic",Meiryo,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07090f;--surface:#0c1019;--text:#ece8df;--muted:#a7a69f;
    --line:#232a3a;--edge:#6f7686;
    --accent:#c9a45c;--accent-ink:#0b0d12;--accent-text:#d4b06a;
  }
}
:root[data-theme="dark"]{
  --bg:#07090f;--surface:#0c1019;--text:#ece8df;--muted:#a7a69f;
  --line:#232a3a;--edge:#6f7686;
  --accent:#c9a45c;--accent-ink:#0b0d12;--accent-text:#d4b06a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.9;font-size:1rem}
button,input{font-family:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;z-index:50;font-weight:700}
.skip:focus{top:8px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
[tabindex="-1"]{scroll-margin-top:130px}
[tabindex="-1"]:focus{outline:none}
.label{font-size:.7rem;letter-spacing:.28em;color:var(--muted);font-weight:600;margin:0;text-transform:uppercase}
.small{font-size:.875rem;color:var(--muted);margin:.4em 0}
h1{font-family:var(--serif);font-weight:600;font-size:1.55rem;line-height:1.5;margin:.2em 0 .8em;letter-spacing:.08em}
h2{font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.5;margin:0 0 .6em;letter-spacing:.06em}
p{margin:.7em 0}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hud-in{max-width:640px;margin:0 auto;padding:2px 16px 10px}
.hud-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.menu-btn{min-height:44px;min-width:44px;padding:0 14px;background:transparent;color:var(--text);
  border:1px solid var(--line);border-radius:0;font-size:.8rem;font-weight:500;letter-spacing:.16em;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.menu-btn svg{width:16px;height:16px}
.hud-stats{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end}
.stat b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1.4;font-weight:600}
.stat.lv b{color:var(--accent-text)}
.xpwrap .label{display:flex;justify-content:space-between}
.bar{height:3px;background:var(--line);margin-top:10px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line)}
.menu ul{list-style:none;margin:0 auto;padding:6px 16px 10px;max-width:640px}
.menu button{display:block;width:100%;min-height:48px;text-align:left;background:transparent;color:var(--text);
  border:0;border-bottom:1px solid var(--line);font-size:.95rem;letter-spacing:.08em;cursor:pointer;padding:0 4px}
.menu li:last-child button{border-bottom:0}
.notice{background:var(--surface);border-bottom:1px dashed var(--edge);padding:10px 16px;font-size:.9rem;text-align:center}

main{max-width:640px;margin:0 auto;padding:28px 20px 72px;outline:none}
.screen{animation:pop .4s ease-out}

/* card */
.card{position:relative;border:1px solid var(--line);background:var(--surface);padding:20px;border-radius:0;color:var(--text)}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none}
.card::before{top:-1px;left:-1px;border-top:1px solid var(--accent-text);border-left:1px solid var(--accent-text)}
.card::after{right:-1px;bottom:-1px;border-bottom:1px solid var(--accent-text);border-right:1px solid var(--accent-text)}
.card.flash{animation:edge .9s ease-out}
.sect{margin:22px 0}

/* buttons */
.btn{min-height:50px;min-width:44px;padding:0 26px;font-size:.95rem;font-weight:600;letter-spacing:.18em;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;border-radius:0}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--edge);font-weight:500}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.actions .btn{flex:1 1 180px}
.inp{display:block;width:100%;min-height:50px;margin:8px 0 0;padding:8px 14px;font-size:1rem;color:var(--text);
  background:var(--surface);border:1px solid var(--edge);border-radius:0}

/* top */
.title{font-size:2.2rem;letter-spacing:.3em;margin:.3em 0 .3em;font-weight:600}
.title::after{content:"";display:block;width:44px;height:1px;background:var(--accent-text);margin-top:18px}
.sub{color:var(--muted);margin:14px 0 24px;letter-spacing:.06em}
.mrow{display:flex;gap:14px;align-items:flex-start;margin:20px 0}
.mascot{width:80px;flex:none}
.mascot svg{width:100%;height:auto;display:block}
.speech{flex:1;border:1px solid var(--line);border-left:1px solid var(--accent-text);padding:8px 16px;background:var(--surface)}
.speech p{margin:.2em 0}
.info{display:flex;gap:36px;margin:22px 0}
.info b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:600}
.note{font-size:.9rem;color:var(--muted);border-left:1px solid var(--edge);padding-left:14px;margin:20px 0}

/* map */
.map{list-style:none;margin:26px 0 0;padding:0}
.q-li{position:relative;padding:0 0 26px 68px}
.q-li:last-child{padding-bottom:0}
.nodeicon{position:absolute;left:0;top:0;width:52px;height:52px;border:1px solid var(--accent-text);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--accent-text)}
.nodeicon.lock{border-color:var(--edge);color:var(--muted)}
.nodeicon.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nodeicon svg{width:26px;height:26px}
.q-li:not(:last-child)::after{content:"";position:absolute;left:25px;top:52px;bottom:0;width:1px;background:var(--line);transform-origin:top}
.q-li.link-on::after{background:var(--accent-text)}
.q-li.link-new::after{animation:grow .9s ease-out both}
.node{display:block;width:100%;text-align:left;font-size:1rem;cursor:pointer}
.node[aria-disabled="true"]{border-style:dashed;cursor:not-allowed}
.node[aria-disabled="true"] .ntitle{color:var(--muted)}
.ntitle{display:block;font-family:var(--serif);font-size:1.1rem;font-weight:600;line-height:1.6;margin-top:2px;letter-spacing:.04em}
.nsub{display:block;color:var(--muted);font-size:.875rem}
.nstat{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:22px;height:22px}
.stars .on{fill:var(--accent);stroke:var(--accent-text);stroke-width:1.2}
.stars .off{fill:none;stroke:var(--edge);stroke-width:1.2}

/* quest */
.segs{display:flex;gap:4px;margin:8px 0 22px}
.segs span{flex:1;height:2px;background:var(--line)}
.segs .d{background:var(--accent-text)}
.segs .c{background:var(--text)}
.qtext{font-size:1.05rem;font-weight:500;margin:0;line-height:1.9}
.terms{margin:12px 0 0;font-size:.875rem;color:var(--muted)}
.terms b{color:var(--text)}
.rulebox{margin-top:16px;border:1px dashed var(--edge);padding:12px 16px}
.rulebox ul{margin:.3em 0;padding-left:1.2em}
.hint{font-size:.875rem;color:var(--muted);margin:18px 0 4px}
.opts{margin:0}
.opts.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;min-height:50px;padding:13px 16px;margin:10px 0;
  border:1px solid var(--edge);background:var(--surface);cursor:pointer;border-radius:0}
.opts.tf .opt{margin:6px 0}
.opt input{flex:none;width:20px;height:20px;margin:4px 0 0;accent-color:var(--accent-text)}
.opt:focus-within{outline:2px solid var(--accent-text);outline-offset:3px}
.opt.sel,.opt.ok{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
.opt.ng{border-style:dashed;border-color:var(--text)}
.opt .body{display:block}
.mk{display:block;font-weight:600;color:var(--accent-text);font-size:.875rem;letter-spacing:.06em}
.opt.ng .mk{color:var(--text)}
.steps{list-style:none;margin:10px 0;padding:0}
.steps li{margin:10px 0}
.step{display:flex;gap:14px;align-items:center;width:100%;min-height:50px;padding:11px 16px;text-align:left;font-size:1rem;
  color:var(--text);background:var(--surface);border:1px solid var(--edge);cursor:pointer;border-radius:0}
.step.on{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
.step[disabled]{cursor:default;color:var(--text);-webkit-text-fill-color:var(--text)}
.num{flex:none;width:28px;height:28px;border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem}
.step.on .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{margin-top:26px;border:1px solid var(--accent-text);padding:18px 20px;background:var(--surface)}
.fb.bad{border-style:dashed;border-color:var(--text)}
.fb-title{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:0;letter-spacing:.06em}
.fb-xp{margin:.3em 0;font-weight:600;color:var(--accent-text)}
.combo{display:inline-block;border:1px solid var(--accent-text);color:var(--accent-text);padding:0 12px;margin-left:10px;
  letter-spacing:.14em;font-size:.85rem;animation:pop .4s ease-out}
.fb-exp{margin:.7em 0}
.answerlist{margin:.4em 0 .6em;padding-left:1.4em}

/* result / cert */
.big{font-family:var(--serif);font-size:2.3rem;font-weight:600;color:var(--accent-text);line-height:1.4;margin:.2em 0}
.rlist{list-style:none;margin:10px 0;padding:0}
.rlist li{display:flex;align-items:center;gap:14px;margin:10px 0}
.rlist svg{width:40px;height:40px;flex:none}
.cert-card{padding:36px 22px;text-align:center;border-color:var(--accent-text);outline:1px solid var(--line);outline-offset:-9px}
.cert-co{letter-spacing:.2em;color:var(--muted);margin:0}
.cert-name{font-family:var(--serif);font-size:1.8rem;font-weight:600;margin:.4em 0;letter-spacing:.1em}
.cert-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:22px 0;text-align:left}
.cert-meta dt{font-size:.7rem;letter-spacing:.26em;color:var(--muted);font-weight:600}
.cert-meta dd{margin:0;font-family:var(--serif);font-size:1.1rem;font-weight:600}
.cert-badges{list-style:none;margin:10px 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center}
.cert-badges li{display:flex;align-items:center;gap:6px;font-size:.9rem}
.cert-badges svg{width:28px;height:28px}

/* badges / glossary / company */
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:0;padding:0;list-style:none}
.bitem{display:flex;gap:16px;align-items:center}
.bitem svg{width:54px;height:54px;flex:none}
.bitem b{display:block;font-family:var(--serif)}
.bitem .st{font-size:.7rem;letter-spacing:.22em;font-weight:600;color:var(--accent-text);display:block}
.bitem.no .st{color:var(--muted)}
dl.gl{margin:0}
dl.gl .card{margin:16px 0}
dl.gl dt{font-family:var(--serif);font-weight:600;font-size:1.05rem}
dl.gl dd{margin:.2em 0 0}
.citem{display:flex;gap:16px;margin:16px 0}
.cno{font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--accent-text);min-width:2.2em}
.msg{min-height:1.5em;font-weight:600;margin:10px 0 0}
.warn{border-style:dashed;border-color:var(--text)}

@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes edge{0%{border-color:var(--accent-text);box-shadow:0 0 0 1px var(--accent-text)}100%{border-color:var(--line);box-shadow:0 0 0 0 transparent}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (max-width:380px){
  .opts.tf{grid-template-columns:1fr}
  .mascot{width:64px}
  .title{font-size:1.7rem;letter-spacing:.22em}
  main{padding:22px 16px 64px}
}
@media print{
  @page{margin:16mm}
  body{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--line:#999;--edge:#444;--accent:#ddd;--accent-text:#000;--accent-ink:#000;
    background:#fff;color:#000}
  .hud,.menu,.notice,.no-print,.skip{display:none!important}
  main{max-width:none;padding:0}
  .card{break-inside:avoid;border-color:#000}
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div id="notice" class="notice" role="status" hidden></div>
<header class="hud" id="hud">
  <div class="hud-in">
    <div class="hud-top">
      <span class="label">First Day Quest</span>
      <button type="button" class="menu-btn" id="menubtn" data-act="toggle-menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        メニュー
      </button>
    </div>
    <div class="hud-stats">
      <div class="stat lv"><span class="label">Level</span><b id="hud-lv">01</b></div>
      <div class="xpwrap">
        <div class="label"><span>XP</span><span id="hud-xp">0 / 40</span></div>
        <div class="bar" id="hud-bar" role="progressbar" aria-label="次のレベルまでのXP" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0"><i id="hud-fill"></i></div>
      </div>
      <div class="stat"><span class="label">Rank</span><b id="hud-rank">見習い</b></div>
    </div>
  </div>
  <nav class="menu" id="menu" aria-label="メニュー" hidden>
    <ul>
      <li><button type="button" data-act="go" data-to="top">トップ画面</button></li>
      <li><button type="button" data-act="go" data-to="map">クエストマップ</button></li>
      <li><button type="button" data-act="go" data-to="badges">バッジ一覧</button></li>
      <li><button type="button" data-act="go" data-to="glossary">用語の説明</button></li>
      <li><button type="button" data-act="go" data-to="settings">設定</button></li>
      <li id="menu-cert" hidden><button type="button" data-act="go" data-to="cert">修了証</button></li>
    </ul>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<noscript><p style="padding:16px">この教材を使うには、JavaScriptをオンにしてください。</p></noscript>

<script>
"use strict";
/* ==========================================================================
   CONFIG(データ)── 会社ごとに差しかえる場所
   --------------------------------------------------------------------------
   【会社ごとに差しかえる手順】
   1. companyName を、その会社の名前に変える。
   2. rules(連絡手段・連絡する時刻・相談先)を、その会社の実際の決まりに書きかえる。
      見本では末尾に「(例)」がついている。実際の決まりにしたら「(例)」を消し、
      disclaimer(「これは例です」の文)も、会社と相談して消すか書きかえる。
   3. quests と boss の questions を、その会社の場面・言葉に合わせて書きかえる。
      - type は "choice"(3つの選択肢)/ "truefalse"(○×)/ "order"(並べ替え)。
      - choice    : options は文字列の配列、answer は正解の番号(0はじまり)。
      - truefalse : answer は true または false。options は不要。
      - order     : options は画面に出る順(正解の順でなくてよい)。
                    answer は「正解の順に並べた options の番号」の配列。
      - ruleKeys  : ["lateContact"] のように書くと、その会社のルールを問題の下に表示する。
      - 文章の中に {rules.lateContact} と書くと、rules の内容が入る。
      - terms     : ["勤怠"] のように書くと、glossary の説明が問題に付く。
      - note      : 問題に付ける補足の説明(任意)。
   4. glossary(用語)と、badges の name / condition を書きかえる。
   5. quests の id(q1〜q5)と、badges の id は、プログラムと結びついているので変えない。
   6. companyPage(「貴社版では、ここが変わります」ページ)を、納品用の説明に書きかえる。
      納品版では、この「見本」の文言を、その会社向けの文言に変える。
   7. ゲームの数値(xp / levels / starRule)は、このCONFIGの中で調整できる。
   見た目や動きは、このあとの <script> と、上の <style> にある。通常は触らない。
   ========================================================================== */
const CONFIG = {
  appTitle: "初日クエスト",
  appLabel: "First Day Quest",
  appSubtitle: "新人・アルバイト向け 研修教材(見本)",
  companyName: "サンプル商事(架空)",
  mascot: {
    name: "先輩",
    lines: {
      welcome: "ようこそ。いっしょに、初日の練習をしましょう。分からないことがあっても、大丈夫です。",
      correct: "いいですね。そのとおりです。",
      retry: "おしい。説明を読んで、もう一度やってみましょう。",
      combo: "続けて正解です。すばらしい。",
      clear: "クエストクリアです。おつかれさま。",
      done: "全部クリアです。おめでとう。あなたなら、きっと大丈夫です。"
    }
  },
  disclaimer: "これは例です。実際のルールは、会社の指示に従ってください。",
  rules: { // 会社ごとに変わる項目。見本では、すべて「(例)」
    lateContact: "遅れそうだと分かったら、すぐに、電話で責任者に連絡する。電話がつながらないときは、会社のチャットにも書く(例)",
    absenceContact: "休むときは、始業の前に、電話で責任者に連絡する。時刻や方法は、会社の指示に従う(例)",
    consultation: "まず、近くの先輩か責任者に話す。話しにくいときは、総務の相談窓口に連絡する(例)"
  },
  ruleLabels: { lateContact: "遅刻の連絡", absenceContact: "休むときの連絡", consultation: "相談先" },
  ranks: ["見習い", "新人", "一人前", "頼れる仲間"],
  xp: { correct: 10, comboStep: 2, comboMax: 10, retryRate: 0.5, questClear: 10, bossClear: 30 },
  levels: { base: 40, step: 20, rankAt: [1, 2, 3, 4] }, // 次のレベルに必要なXP = base + step × (現在のレベル − 1)
  starRule: { three: 0, two: 2 },                       // まちがえた回数が three 以下なら星3、two 以下なら星2、それより多いと星1
  quests: [
    { id: "q1", title: "あいさつと身だしなみ", subtitle: "出勤したときの第一声と、気持ちのよい印象",
      questions: [
        { type: "choice", text: "出勤して、職場に入るところです。先輩や同僚が近くにいます。最初に、どうしますか?",
          options: ["明るい声で「おはようございます」と言い、軽く頭を下げる", "だまって自分の席へ行き、仕事の準備を始める", "目が合ったときだけ、小さい声であいさつする"],
          answer: 0, explanation: "あいさつは、仕事の第一歩です。自分から、相手に聞こえる声で言うと、みんなが安心します。" },
        { type: "truefalse", text: "始業の前に、鏡で髪や服を確認するのは、よい習慣である。",
          answer: true, explanation: "そのとおりです。清潔で、仕事がしやすい服装は、お客様にも同僚にも安心感を与えます。制服や服装の決まりは、会社で確認しましょう。" },

const fmt = s => String(s).replace(/\{rules\.(\w+)\}/g, (m, k) => Object.prototype.hasOwnProperty.call(CONFIG.rules, k) ? CONFIG.rules[k] : "");
const t = s => esc(fmt(s));
const pad = n => String(n).padStart(2, "0");

const DEFAULT = () => ({ v: 1, name: "", nameAsked: false, theme: "auto", xp: 0, progress: {}, badges: [], bestStreak: 0, anyPerfect: false, completedAt: "" });

/* ---- 保存 ---- */
const Store = {
  ok: true,
  init() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); this.ok = true; } catch (e) { this.ok = false; } },
  load() { if (!this.ok) return null; try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  save() { if (!this.ok) return false; try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch (e) { this.ok = false; showStorageNotice(); return false; } },
  clear() { try { localStorage.removeItem(KEY); } catch (e) { /* 何もしない */ } }
};
function showStorageNotice() {
  const n = $("notice");
  n.textContent = "このブラウザでは記録を保存できません。画面を閉じると消えます。";
  n.hidden = false;
}
function allIds() { return CONFIG.quests.map(q => q.id).concat("boss"); }
function getQuest(id) { return id === "boss" ? Object.assign({ id: "boss" }, CONFIG.boss) : CONFIG.quests.find(q => q.id === id); }
function sanitize(raw) {
  if (!raw || typeof raw !== "object") return null;
  const s = DEFAULT();
  s.name = typeof raw.name === "string" ? raw.name.slice(0, 20) : "";
  s.nameAsked = !!raw.nameAsked || s.name !== "";
  s.theme = ["auto", "light", "dark"].indexOf(raw.theme) >= 0 ? raw.theme : "auto";
  s.xp = Number.isFinite(raw.xp) ? Math.max(0, Math.min(100000, Math.floor(raw.xp))) : 0;
  if (raw.progress && typeof raw.progress === "object") {
    allIds().forEach(id => {
      const p = raw.progress[id];
      if (p && typeof p === "object" && p.cleared) {
        s.progress[id] = { cleared: true, stars: Math.min(3, Math.max(1, Math.floor(Number(p.stars)) || 1)), perfect: !!p.perfect };
      }
    });
  }
  const bids = CONFIG.badges.map(b => b.id);
  if (Array.isArray(raw.badges)) raw.badges.forEach(b => { if (bids.indexOf(b) >= 0 && s.badges.indexOf(b) < 0) s.badges.push(b); });
  s.bestStreak = Number.isFinite(raw.bestStreak) ? Math.max(0, Math.min(999, Math.floor(raw.bestStreak))) : 0;
  s.anyPerfect = !!raw.anyPerfect;
  s.completedAt = typeof raw.completedAt === "string" && !isNaN(Date.parse(raw.completedAt)) ? raw.completedAt : "";
  return s;
}

/* ---- レベル・ランク ---- */
function levelInfo(xp) {
  let lv = 1, rest = xp, need = CONFIG.levels.base;
  while (rest >= need) { rest -= need; lv++; need = CONFIG.levels.base + CONFIG.levels.step * (lv - 1); }
  return { level: lv, into: rest, need: need };
}
function rankOf(level) {
  let idx = 0;
  CONFIG.levels.rankAt.forEach((l, i) => { if (level >= l) idx = i; });
  return CONFIG.ranks[Math.min(idx, CONFIG.ranks.length - 1)];
}
function isUnlocked(id) {
  const ids = allIds(), i = ids.indexOf(id);
  if (i < 0) return false;
  return ids.slice(0, i).every(x => state.progress[x] && state.progress[x].cleared);
}
function cleared(id) { return !!(state.progress[id] && state.progress[id].cleared); }
function callName() { return state.name ? state.name + "さん" : "あなた"; }
function fmtDate(iso) { const d = new Date(iso); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function line(kind) { const l = CONFIG.mascot.lines[kind]; return Array.isArray(l) ? l[(S ? S.idx : 0) % l.length] : (l || ""); }

  h += '<div class="card sect' + (view.confirmReset ? ' warn' : '') + '"><h2>記録を消す</h2>';
  if (view.confirmReset) {
    h += '<p><b>注意:</b>本当に、すべての記録を消しますか?消した記録は、元にもどせません。書き出したファイルがあれば、あとで読み込めます。</p>';
    h += '<div class="actions"><button type="button" class="btn line" data-act="reset-cancel" data-first>やめる</button><button type="button" class="btn" data-act="reset-do">消す</button></div>';
  } else {
    h += '<p>進み具合、得点、バッジ、呼び名を、すべて消します。</p><div class="actions"><button type="button" class="btn line" data-act="reset-ask">記録を消す</button></div>';
  }
  h += '</div>';
  h += '<div class="card sect"><h2>この教材について</h2><p>この教材は見本です。インターネットにつながなくても動きます。アクセス解析や広告はなく、記録は、このブラウザの中にだけ保存されます。</p>';
  h += '<div class="actions"><button type="button" class="btn line" data-act="go" data-to="company">貴社版では、ここが変わります</button></div></div>';
  return h + '</section>';
}

/* ---- クエストの進行 ---- */
function startQuest(id) {
  if (!isUnlocked(id)) return;
  const quest = getQuest(id);
  S = { id: id, quest: quest, no: allIds().indexOf(id) + 1, isBoss: id === "boss", idx: 0, mistakes: 0, streak: 0, maxStreak: 0, xp: 0,
    practice: cleared(id), phase: "answering", attempts: 0, sel: null, seq: [], last: null, flash: false };
  go("quest");
}
function checkAnswer() {
  if (!S || S.phase !== "answering" || !canCheck()) return;
  const q = curQ();
  S.attempts++;
  if (judge(q)) {
    let gain = 0, bonus = 0, retry = S.attempts > 1;
    if (!retry) { S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak); }
    if (!S.practice) {
      if (!retry) { gain = CONFIG.xp.correct; if (S.streak >= 2) bonus = Math.min(CONFIG.xp.comboStep * (S.streak - 1), CONFIG.xp.comboMax); }
      else gain = Math.round(CONFIG.xp.correct * CONFIG.xp.retryRate);
    }
    S.xp += gain + bonus;
    S.last = { gain: gain + bonus, bonus: bonus, retry: retry };
    S.phase = "right"; S.flash = true;
  } else {
    S.mistakes++; S.streak = 0; S.phase = "wrong"; S.last = {};
  }
  render("#fb");
}
function nextQuestion() {
  if (S.idx + 1 < S.quest.questions.length) {
    S.idx++; S.phase = "answering"; S.attempts = 0; S.sel = null; S.seq = []; S.last = null;
    render();
  } else finishQuest();
}
function evalBadges() {
  const qids = CONFIG.quests.map(q => q.id);
  const cond = {
    first: () => cleared("q1"),
    contact: () => cleared("q2") && cleared("q3"),
    streak3: () => state.bestStreak >= 3,
    nomiss: () => state.anyPerfect,
    allstars: () => qids.every(id => state.progress[id] && state.progress[id].stars === 3),
    complete: () => cleared("boss")
  };
  CONFIG.badges.forEach(b => { if (cond[b.id] && cond[b.id]() && state.badges.indexOf(b.id) < 0) state.badges.push(b.id); });
}
function finishQuest() {
  const id = S.id, ids = allIds(), i = ids.indexOf(id);
  const nextId = i + 1 < ids.length ? ids[i + 1] : null;
  const nextWas = nextId ? isUnlocked(nextId) : false;
  const before = levelInfo(state.xp).level;
  const mistakes = S.mistakes;
  const stars = mistakes <= CONFIG.starRule.three ? 3 : (mistakes <= CONFIG.starRule.two ? 2 : 1);
  const prev = state.progress[id];
  const bonus = S.practice ? 0 : (id === "boss" ? CONFIG.xp.bossClear : CONFIG.xp.questClear);
  const earned = S.xp + bonus;
  state.xp += earned;
  state.progress[id] = { cleared: true, stars: Math.max(stars, prev ? prev.stars : 0), perfect: !!(prev && prev.perfect) || mistakes === 0 };
  if (mistakes === 0) state.anyPerfect = true;
  state.bestStreak = Math.max(state.bestStreak, S.maxStreak);
  if (id === "boss" && !state.completedAt) state.completedAt = new Date().toISOString();
  const had = state.badges.slice();
  evalBadges();
  const nb = state.badges.filter(b => had.indexOf(b) < 0);
  const after = levelInfo(state.xp).level;
  if (nextId && !nextWas && isUnlocked(nextId)) lastUnlocked = nextId;
  R = { id: id, stars: stars, mistakes: mistakes, earned: earned, bonus: bonus, practice: S.practice, newBadges: nb,
    levelBefore: before, levelAfter: after, rankBefore: rankOf(before), rankAfter: rankOf(after),
    nextId: nextId && isUnlocked(nextId) ? nextId : null };
  S = null;
  Store.save();
  go("result");
}
function refreshOrder() {
  const q = curQ();
  document.querySelectorAll(".step").forEach(b => {
    const p = S.seq.indexOf(+b.dataset.i);
    b.classList.toggle("on", p >= 0);
    b.setAttribute("aria-pressed", p >= 0 ? "true" : "false");
    b.querySelector(".num").textContent = p >= 0 ? String(p + 1) : "";
    b.querySelector(".pos").textContent = p >= 0 ? "(選んだ順番:" + (p + 1) + "番目)" : "";
  });
  const c = $("seqcount");
  if (c) c.textContent = "選んだ数:" + S.seq.length + " / " + q.options.length;
  updateCheck();
}
function updateCheck() { const b = $("chk"); if (b) b.disabled = !canCheck(); }
function syncRadios(name) {
  document.querySelectorAll('input[name="' + name + '"]').forEach(inp => { const o = inp.closest(".opt"); if (o) o.classList.toggle("sel", inp.checked); });
}

/* ---- 書き出し・読み込み ---- */
function exportRecord() {
  try {
    const payload = { app: APPID, version: 1, exportedAt: new Date().toISOString(), state: state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "first-day-quest-record.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setMsg("msg-bak", "記録を書き出しました。ファイルは、ダウンロードの保存先に入ります。");
  } catch (e) { setMsg("msg-bak", "書き出せませんでした。このブラウザでは、ファイルの保存ができないようです。"); }
}
function importRecord(file) {
  if (!file) return;
  const bad = "このファイルは読み込めません。この教材で書き出した、記録のファイルを選んでください。";
  if (file.size > 1000000) { setMsg("msg-bak", bad); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || o.app !== APPID || !o.state) throw new Error("x");
      const s = sanitize(o.state);
      if (!s) throw new Error("x");
      state = s; Store.save(); applyTheme();
      go("settings", { msg: "記録を読み込みました。" });
    } catch (e) { setMsg("msg-bak", bad); }
  };
  fr.onerror = () => setMsg("msg-bak", bad);
  fr.readAsText(file);
}
function setMsg(id, text) { const el = $(id); if (el) el.textContent = text; }

/* ---- 操作(イベント) ---- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (!$("menu").hidden && !e.target.closest("#menu")) closeMenu();
    return;
  }
  const act = el.dataset.act;
  if (act !== "toggle-menu" && !$("menu").hidden && !el.closest("#menu")) closeMenu();
  switch (act) {
    case "toggle-menu": toggleMenu(); break;
    case "go": S = null; go(el.dataset.to); break;
    case "quest": if (el.getAttribute("aria-disabled") === "true") return; startQuest(el.dataset.id); break;
    case "check": checkAnswer(); break;
    case "retry": S.phase = "answering"; S.sel = null; S.seq = []; S.last = null; render("[data-first]"); break;
    case "reveal": S.phase = "revealed"; S.last = {}; render("#fb"); break;
    case "next": nextQuestion(); break;
    case "step": { if (!S || S.phase !== "answering") return; const i = +el.dataset.i, k = S.seq.indexOf(i); if (k >= 0) S.seq.splice(k, 1); else S.seq.push(i); refreshOrder(); break; }
    case "order-clear": S.seq = []; refreshOrder(); break;
    case "export": exportRecord(); break;
    case "import": { const f = $("imp"); if (f) f.click(); break; }
    case "reset-ask": go("settings", { confirmReset: true }, "[data-first]"); break;
    case "reset-cancel": go("settings"); break;
    case "reset-do":
      Store.clear(); state = DEFAULT(); S = null; R = null; applyTheme(); Store.save(); go("top"); break;
    case "start": startGame(); break;
    case "save-name": saveName(); break;
    case "print": window.print(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.matches('input[name="ans"]') && S) {
    S.sel = curQ().type === "truefalse" ? el.value === "true" : +el.value;
    syncRadios("ans"); updateCheck();
  } else if (el.matches('input[name="theme"]')) {
    state.theme = el.value; applyTheme(); Store.save(); syncRadios("theme");
  } else if (el.id === "imp") {
    importRecord(el.files && el.files[0]); el.value = "";
  }
});
function startGame() {
  const inp = $("nick");
  if (inp) state.name = String(inp.value || "").trim().slice(0, 20);
  state.nameAsked = true; Store.save(); go("map");
}
function saveName() {
  const inp = $("nm");
  state.name = String(inp ? inp.value : "").trim().slice(0, 20); state.nameAsked = true;
  Store.save(); setMsg("msg-name", "保存しました。");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("menu").hidden) { closeMenu(); $("menubtn").focus(); }
  if (e.key === "Enter" && e.target && e.target.id === "nick") { e.preventDefault(); startGame(); }
  if (e.key === "Enter" && e.target && e.target.id === "nm") { e.preventDefault(); saveName(); }
});

/* ---- 起動 ---- */
Store.init();
const loaded = sanitize(Store.load());
if (loaded) state = loaded;
applyTheme();
if (!Store.ok) showStorageNotice();
render();
</script>
